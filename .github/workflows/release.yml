name: release

# Tag v<version> to publish the binaries. The sdk-v* and sdk-js-v* tags belong
# to the Python and Node.js packages and are handled by their respective workflows.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # cosign signs with the token this grants; there is no key to store.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # goreleaser reads the tag history to name the build.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # cosign-installer publishes no moving major tag, only exact versions.
      - uses: sigstore/cosign-installer@v4.1.3
      # SDK tags share this repository. Keep the CLI changelog anchored to the
      # previous CLI release instead of the most recent SDK tag.
      - name: Select previous CLI release
        run: |
          previous=$(git describe --tags --match 'v[0-9]*' --abbrev=0 HEAD^)
          echo "GORELEASER_PREVIOUS_TAG=$previous" >> "$GITHUB_ENV"
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          # A release tag needs a reviewed note file with the same name.
          args: release --clean --release-notes .github/release-notes/${{ github.ref_name }}.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Push access to the homebrew-tap repo. Absent until the tap is set up,
          # in which case goreleaser skips the formula and the release still ships.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
