name: publish-sdk

# Tag sdk-v<version> to release capybara-sdk. A manual run stops after the test
# index, so the flow can be exercised without burning a real PyPI version.
on:
  push:
    tags: ["sdk-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.25"
      - id: version
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/capybara/__init__.py)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "sdk-v${{ steps.version.outputs.version }}" = "${{ github.ref_name }}"
      - run: uv build --out-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: sdk/dist

  test-index:
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  verify:
    needs: [build, test-index]
    runs-on: ubuntu-latest
    steps:
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.25"
      - name: install from the test index
        env:
          VERSION: ${{ needs.build.outputs.version }}
        # Dependencies do not exist on the test index, so resolve them from PyPI;
        # the upload takes a moment to become installable.
        run: |
          for _ in 1 2 3 4 5; do
            uv run --isolated --no-project \
              --index https://test.pypi.org/simple/ \
              --index-strategy unsafe-best-match \
              --with "capybara-sdk==$VERSION" \
              python -c "import capybara; assert capybara.__version__ == '$VERSION'" && exit 0
            sleep 20
          done
          exit 1

  pypi:
    needs: [verify]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
