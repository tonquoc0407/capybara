name: publish-sdk-js

# Tag sdk-js-v<version> to publish capybara-sdk to npm with provenance.
# A manual workflow_dispatch run builds, typechecks, tests, and packs
# without publishing to npm.
on:
  push:
    tags: ["sdk-js-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        working-directory: sdk-js
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: sdk-js/package-lock.json
      - id: version
        run: |
          version=$(node -p "require('./package.json').version")
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "sdk-js-v${{ steps.version.outputs.version }}" = "${{ github.ref_name }}"
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm pack --dry-run

  publish:
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk-js
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: sdk-js/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

