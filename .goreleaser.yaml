version: 2

project_name: capybara

builds:
  - main: ./cmd/capybara
    binary: capybara
    env:
      - CGO_ENABLED=0
    # Fills main.version, which the splash prints.
    ldflags: ["-s -w -X main.version={{.Version}}"]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

# Publishes a cask to github.com/tonquoc0407/homebrew-tap on each tag, so
# `brew install tonquoc0407/tap/capybara` tracks releases. skip_upload is on
# whenever HOMEBREW_TAP_TOKEN is unset, so a tag before the tap exists still
# ships its binaries instead of failing here.
homebrew_casks:
  - name: capybara
    binaries:
      - capybara
    repository:
      owner: tonquoc0407
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/tonquoc0407/capybara"
    description: "Terminal trace debugger for AI agents."
    skip_upload: '{{ if index .Env "HOMEBREW_TAP_TOKEN" }}false{{ else }}true{{ end }}'
    # The binaries are unsigned, so strip the quarantine flag or macOS refuses
    # to run them with a "damaged" alert.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/capybara"]
          end

# Keyless signing: cosign takes its identity from the workflow's OIDC token, so
# there is no private key to keep. The checksums file is the only artifact
# signed, since every archive is named in it.
signs:
  - cmd: cosign
    artifacts: checksum
    output: true
    # cosign writes one sigstore bundle now; the separate --output-signature
    # and --output-certificate it replaced are deprecated and ignored.
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"

changelog:
  sort: asc
  # The subject is the information; a 40-character sha in front of it is not.
  abbrev: 0
  groups:
    - title: Features
      regexp: '^feat(\(.+\))?!?:'
      order: 0
    - title: Fixes
      regexp: '^fix(\(.+\))?!?:'
      order: 1
    - title: Dependencies
      regexp: '^build\(deps\)'
      order: 2
    # Anything that does not announce its own kind still belongs in the notes.
    - title: Other
      order: 99
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'

release:
  footer: |
    ---
    Verify a download against the signed checksums:

    ```
    cosign verify-blob checksums.txt \
      --bundle checksums.txt.sigstore.json \
      --certificate-identity-regexp 'https://github.com/tonquoc0407/capybara/.*' \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com
    sha256sum --check --ignore-missing checksums.txt
    ```
